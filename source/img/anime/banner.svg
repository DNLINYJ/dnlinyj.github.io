<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2a5e"/>
      <stop offset="0.35" stop-color="#6b5bb8"/>
      <stop offset="0.62" stop-color="#b47fd4"/>
      <stop offset="0.82" stop-color="#f19ab8"/>
      <stop offset="1" stop-color="#ffd3c2"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d8" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#ffe9c9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe9c9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffe9f0" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a4d" stop-opacity="0.3"/>
      <stop offset="0.35" stop-color="#241a4d" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#241a4d" stop-opacity="0"/>
      <stop offset="1" stop-color="#241a4d" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="meteor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <g id="blossom">
      <g fill="#ffc4d8">
        <ellipse cx="0" cy="-7" rx="4.6" ry="7"/>
        <ellipse cx="0" cy="-7" rx="4.6" ry="7" transform="rotate(72)"/>
        <ellipse cx="0" cy="-7" rx="4.6" ry="7" transform="rotate(144)"/>
        <ellipse cx="0" cy="-7" rx="4.6" ry="7" transform="rotate(216)"/>
        <ellipse cx="0" cy="-7" rx="4.6" ry="7" transform="rotate(288)"/>
      </g>
      <circle r="2.6" fill="#ffe89b"/>
    </g>
    <g id="blossom2">
      <g fill="#ff9fc0">
        <ellipse cx="0" cy="-6" rx="4" ry="6"/>
        <ellipse cx="0" cy="-6" rx="4" ry="6" transform="rotate(72)"/>
        <ellipse cx="0" cy="-6" rx="4" ry="6" transform="rotate(144)"/>
        <ellipse cx="0" cy="-6" rx="4" ry="6" transform="rotate(216)"/>
        <ellipse cx="0" cy="-6" rx="4" ry="6" transform="rotate(288)"/>
      </g>
      <circle r="2.2" fill="#fff0b8"/>
    </g>
    <path id="petal" d="M0,-8 C6,-4 6,4 0,9 C-6,4 -6,-4 0,-8" />
    <g id="star4">
      <path d="M0,-9 C1,-2.5 2.5,-1 9,0 C2.5,1 1,2.5 0,9 C-1,2.5 -2.5,1 -9,0 C-2.5,-1 -1,-2.5 0,-9" fill="#fff"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="105" r="2.1" opacity="0.9"/>
    <circle cx="260" cy="210" r="1.4" opacity="0.7"/>
    <circle cx="410" cy="80" r="1.8" opacity="0.85"/>
    <circle cx="555" cy="180" r="1.2" opacity="0.6"/>
    <circle cx="700" cy="60" r="2" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.25;0.9" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="835" cy="200" r="1.4" opacity="0.65"/>
    <circle cx="960" cy="95" r="1.7" opacity="0.8"/>
    <circle cx="1085" cy="170" r="1.2" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="5.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1180" cy="70" r="2.2" opacity="0.95"/>
    <circle cx="1310" cy="150" r="1.3" opacity="0.6"/>
    <circle cx="1680" cy="90" r="1.9" opacity="0.85">
      <animate attributeName="opacity" values="0.85;0.3;0.85" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1800" cy="205" r="1.5" opacity="0.7"/>
    <circle cx="1600" cy="330" r="1.3" opacity="0.55"/>
    <circle cx="200" cy="330" r="1.5" opacity="0.6"/>
    <circle cx="80" cy="470" r="1.2" opacity="0.45"/>
    <circle cx="500" cy="300" r="1.3" opacity="0.55"/>
    <circle cx="890" cy="320" r="1.2" opacity="0.5"/>
    <circle cx="1440" cy="420" r="1.2" opacity="0.4"/>
  </g>
  <use href="#star4" x="330" y="140" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="4.8s" repeatCount="indefinite"/>
  </use>
  <use href="#star4" x="1240" y="240" transform="scale(0.8)" opacity="0.7"/>
  <use href="#star4" x="760" y="150" transform="scale(0.65)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.25;0.8" dur="6s" repeatCount="indefinite"/>
  </use>

  <!-- meteor -->
  <g opacity="0.8">
    <line x1="1010" y1="120" x2="1180" y2="235" stroke="url(#meteor)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="1180" cy="235" r="3.2" fill="#ffffff"/>
  </g>

  <!-- moon -->
  <circle cx="1450" cy="235" r="230" fill="url(#moonGlow)"/>
  <circle cx="1450" cy="235" r="92" fill="#fff6e4"/>
  <circle cx="1418" cy="205" r="14" fill="#f4e2c4" opacity="0.65"/>
  <circle cx="1472" cy="262" r="20" fill="#f4e2c4" opacity="0.5"/>
  <circle cx="1487" cy="212" r="9" fill="#f4e2c4" opacity="0.55"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.14">
    <ellipse cx="360" cy="420" rx="230" ry="26"/>
    <ellipse cx="480" cy="395" rx="150" ry="20"/>
    <ellipse cx="1000" cy="500" rx="280" ry="24"/>
    <ellipse cx="1120" cy="475" rx="160" ry="18"/>
  </g>
  <g fill="#ffc9dd" opacity="0.32">
    <ellipse cx="1520" cy="390" rx="240" ry="22"/>
    <ellipse cx="1640" cy="365" rx="130" ry="16"/>
    <ellipse cx="180" cy="560" rx="200" ry="20"/>
  </g>

  <!-- far hills -->
  <path d="M0,760 C160,700 330,740 520,715 C700,692 830,730 1010,712 C1220,690 1370,738 1560,720 C1700,707 1820,725 1920,705 L1920,1080 L0,1080 Z" fill="#43397e" opacity="0.85"/>

  <!-- city silhouette -->
  <g fill="#2c2456">
    <path d="M0,860 L0,802 L58,802 L58,830 L96,830 L96,780 L104,780 L104,768 L112,780 L120,780 L120,860 Z"/>
    <rect x="150" y="812" width="70" height="60"/>
    <rect x="176" y="790" width="10" height="26"/>
    <rect x="250" y="826" width="90" height="50"/>
    <rect x="360" y="800" width="56" height="76"/>
    <rect x="380" y="782" width="8" height="20"/>
    <rect x="450" y="836" width="110" height="44"/>
    <rect x="590" y="806" width="64" height="70"/>
    <rect x="700" y="828" width="86" height="52"/>
    <rect x="726" y="810" width="12" height="20"/>
    <rect x="830" y="798" width="54" height="80"/>
    <rect x="920" y="830" width="96" height="50"/>
    <rect x="1050" y="808" width="60" height="70"/>
    <rect x="1068" y="788" width="9" height="22"/>
    <rect x="1150" y="834" width="100" height="48"/>
    <rect x="1290" y="806" width="58" height="74"/>
    <rect x="1390" y="828" width="88" height="52"/>
    <rect x="1520" y="800" width="52" height="80"/>
    <rect x="1536" y="780" width="8" height="22"/>
    <rect x="1610" y="830" width="94" height="52"/>
    <rect x="1740" y="810" width="62" height="70"/>
    <rect x="1840" y="832" width="80" height="50"/>
  </g>
  <!-- windows -->
  <g fill="#ffd98a" opacity="0.85">
    <rect x="162" y="822" width="6" height="8"/>
    <rect x="188" y="840" width="6" height="8"/>
    <rect x="270" y="836" width="6" height="7"/>
    <rect x="304" y="850" width="6" height="7"/>
    <rect x="372" y="814" width="6" height="8"/>
    <rect x="396" y="838" width="6" height="8"/>
    <rect x="608" y="820" width="6" height="8"/>
    <rect x="630" y="846" width="6" height="8"/>
    <rect x="718" y="840" width="6" height="7"/>
    <rect x="756" y="852" width="6" height="7"/>
    <rect x="842" y="812" width="6" height="8"/>
    <rect x="862" y="842" width="6" height="8"/>
    <rect x="944" y="842" width="6" height="7"/>
    <rect x="1062" y="822" width="6" height="8"/>
    <rect x="1086" y="848" width="6" height="8"/>
    <rect x="1176" y="846" width="6" height="7"/>
    <rect x="1302" y="820" width="6" height="8"/>
    <rect x="1326" y="848" width="6" height="8"/>
    <rect x="1410" y="840" width="6" height="7"/>
    <rect x="1530" y="816" width="6" height="8"/>
    <rect x="1552" y="844" width="6" height="8"/>
    <rect x="1634" y="842" width="6" height="7"/>
    <rect x="1756" y="824" width="6" height="8"/>
    <rect x="1782" y="850" width="6" height="8"/>
  </g>

  <!-- near ground -->
  <path d="M0,930 C240,890 420,916 640,902 C900,886 1080,918 1320,904 C1560,890 1740,914 1920,896 L1920,1080 L0,1080 Z" fill="#221b45"/>

  <!-- torii on the hill -->
  <g fill="#171233" transform="translate(320,842) scale(1.05)">
    <path d="M-52,-64 L52,-64 L58,-54 L-58,-54 Z"/>
    <rect x="-46" y="-52" width="92" height="7"/>
    <rect x="-38" y="-52" width="9" height="58" transform="skewX(-2)"/>
    <rect x="29" y="-52" width="9" height="58" transform="skewX(2)"/>
    <rect x="-5" y="-52" width="10" height="14"/>
  </g>

  <!-- sitting cat silhouette -->
  <g transform="translate(1590,890)" fill="#14102a">
    <path d="M-26,4 C-30,-40 -14,-60 2,-62 C22,-64 30,-44 28,-24 C27,-10 24,-2 22,4 Z"/>
    <circle cx="4" cy="-72" r="17"/>
    <path d="M-7,-84 L-3,-99 L5,-86 Z"/>
    <path d="M9,-86 L16,-100 L21,-84 Z"/>
    <path d="M-24,0 C-40,-6 -48,-22 -42,-36 C-38,-44 -30,-46 -28,-38 C-33,-26 -34,-14 -20,-6 Z"/>
    <ellipse cx="0" cy="4" rx="27" ry="5"/>
  </g>

  <!-- sakura branch top-left -->
  <g stroke="#4b2b40" fill="none" stroke-linecap="round">
    <path d="M-20,60 C170,45 300,120 450,105 C520,98 560,120 600,150" stroke-width="13"/>
    <path d="M300,90 C340,60 400,52 450,58" stroke-width="7"/>
    <path d="M450,105 C480,140 520,158 570,166" stroke-width="6"/>
    <path d="M170,58 C200,30 240,22 280,26" stroke-width="6"/>
  </g>
  <use href="#blossom" transform="translate(180,52) scale(1.7)"/>
  <use href="#blossom2" transform="translate(240,22) scale(1.5) rotate(30)"/>
  <use href="#blossom" transform="translate(292,30) scale(1.9) rotate(60)"/>
  <use href="#blossom2" transform="translate(345,72) scale(1.6) rotate(15)"/>
  <use href="#blossom" transform="translate(408,55) scale(1.8) rotate(45)"/>
  <use href="#blossom2" transform="translate(455,60) scale(1.4)"/>
  <use href="#blossom" transform="translate(505,120) scale(1.7) rotate(80)"/>
  <use href="#blossom2" transform="translate(560,160) scale(1.5) rotate(25)"/>
  <use href="#blossom" transform="translate(600,148) scale(1.3)"/>
  <use href="#blossom2" transform="translate(120,68) scale(1.4) rotate(50)"/>
  <circle cx="215" cy="80" r="5" fill="#ff9fc0"/>
  <circle cx="380" cy="95" r="4.5" fill="#ffc4d8"/>
  <circle cx="530" cy="140" r="4" fill="#ff9fc0"/>

  <!-- sakura branch top-right -->
  <g stroke="#4b2b40" fill="none" stroke-linecap="round">
    <path d="M1940,140 C1800,150 1720,90 1620,95 C1560,98 1520,80 1490,55" stroke-width="12"/>
    <path d="M1700,98 C1670,130 1630,146 1580,150" stroke-width="6"/>
  </g>
  <use href="#blossom2" transform="translate(1740,120) scale(1.7) rotate(20)"/>
  <use href="#blossom" transform="translate(1672,96) scale(1.6) rotate(65)"/>
  <use href="#blossom2" transform="translate(1612,120) scale(1.5)"/>
  <use href="#blossom" transform="translate(1585,148) scale(1.4) rotate(40)"/>
  <use href="#blossom2" transform="translate(1545,70) scale(1.6) rotate(10)"/>
  <use href="#blossom" transform="translate(1500,52) scale(1.3) rotate(75)"/>
  <circle cx="1650" cy="140" r="4.5" fill="#ffc4d8"/>
  <circle cx="1710" cy="80" r="4" fill="#ff9fc0"/>

  <!-- floating petals (static) -->
  <g fill="#ffc4d8">
    <use href="#petal" transform="translate(700,260) rotate(35) scale(1.1)" opacity="0.85"/>
    <use href="#petal" transform="translate(880,420) rotate(-50) scale(0.9)" opacity="0.7"/>
    <use href="#petal" transform="translate(520,520) rotate(70)" opacity="0.75"/>
    <use href="#petal" transform="translate(1240,360) rotate(15) scale(1.2)" opacity="0.8"/>
    <use href="#petal" transform="translate(1420,540) rotate(-30) scale(0.85)" opacity="0.65"/>
    <use href="#petal" transform="translate(300,640) rotate(55) scale(1.05)" opacity="0.7"/>
    <use href="#petal" transform="translate(1080,620) rotate(-70) scale(0.8)" opacity="0.6"/>
    <use href="#petal" transform="translate(1700,460) rotate(40)" opacity="0.7"/>
  </g>
  <g fill="#ff9fc0">
    <use href="#petal" transform="translate(640,380) rotate(-20) scale(0.75)" opacity="0.7"/>
    <use href="#petal" transform="translate(1560,300) rotate(60) scale(0.9)" opacity="0.75"/>
    <use href="#petal" transform="translate(420,300) rotate(10) scale(0.8)" opacity="0.65"/>
    <use href="#petal" transform="translate(960,700) rotate(-45) scale(0.9)" opacity="0.6"/>
  </g>

  <!-- animated falling petals -->
  <g fill="#ffd0e0" opacity="0.9">
    <g>
      <animateTransform attributeName="transform" type="translate" values="240,-40; 320,400; 260,800; 330,1120" dur="26s" repeatCount="indefinite"/>
      <use href="#petal" transform="scale(1.15)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="900,-60; 980,360; 900,760; 990,1120" dur="32s" repeatCount="indefinite"/>
      <use href="#petal" transform="scale(0.95)">
        <animateTransform attributeName="transform" type="rotate" from="120" to="480" dur="7s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="1500,-50; 1580,380; 1500,780; 1600,1120" dur="28s" repeatCount="indefinite"/>
      <use href="#petal">
        <animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="5.5s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="600,-40; 660,420; 590,860; 680,1120" dur="38s" repeatCount="indefinite"/>
      <use href="#petal" transform="scale(0.8)">
        <animateTransform attributeName="transform" type="rotate" from="200" to="560" dur="8s" repeatCount="indefinite" additive="sum"/>
      </use>
    </g>
  </g>

  <rect width="1920" y="900" height="180" fill="url(#mist)"/>
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
